# Tremista desktop -- Wayfire configuration tuned to feel like macOS.
#
# Wayfire is the host compositor: it is wlroots-based (so it is in the same
# performance class as the lightest Wayland WMs, well under Xfce), it is
# floating/stacking rather than tiling, and it ships two things that would
# otherwise be very hard to build from outside a compositor:
#
#   * `scale`   -- true Expose / Mission Control, with live window previews.
#   * hotspots  -- activator bindings that fire when the pointer reaches a
#                  screen corner, which is how Mission Control gets its
#                  top-right corner trigger.
#
# Install to ~/.config/wayfire.ini (see scripts/install.sh).

[core]
# Kept on one line: wf-config's parser is line-oriented and does not join
# backslash continuations.
plugins = alpha animate autostart blur command decoration expo fast-switcher grid idle move place resize scale switcher vswipe vswitch window-rules wm-actions

# macOS has a single row of Spaces, never a grid.
vwidth = 4
vheight = 1

# Cmd-Q. Super stands in for Command throughout this config.
close_top_view = <super> KEY_Q

# Server-side decorations, so every window gets the same traffic-light
# treatment below. Apps with their own headerbars (GTK4/libadwaita) will still
# draw their own regardless; that is a limitation of client-side decorations,
# not of this setting.
preferred_decoration_mode = server


# --- Mission Control ---------------------------------------------------------
[scale]
# The top-right hot corner, plus Super-Up and a three-finger swipe up.
#
# Syntax is `hotspot <corner> <width>x<height> <timeout_ms>`. The 12x12 target
# is deliberately small and the 180ms dwell deliberately non-zero: a corner
# that fires instantly on a 1px edge triggers constantly by accident when you
# reach for a scrollbar or a close button.
toggle = hotspot top-right 12x12 180 | <super> KEY_UP | swipe up 3

# Every window across every workspace, the way Mission Control shows all
# Spaces at once.
toggle_all = <super> <shift> KEY_UP

# macOS's overview settles in roughly a third of a second; Wayfire's 750ms
# default feels sluggish next to it. These are `animation`-typed options, so
# they take a duration *and* an easing curve -- a bare number is ignored.
duration = 300ms circle

spacing = 44
outer_margin = 24
inactive_alpha = 0.85
include_minimized = true
middle_click_close = true
title_overlay = all
title_position = center
title_font_size = 13
bg_color = 0.08 0.08 0.09 0.82
text_color = 0.95 0.95 0.97 1.0


# --- Spaces ------------------------------------------------------------------
[expo]
toggle = <super> KEY_DOWN | swipe down 4
duration = 300ms circle
background = 0.08 0.08 0.09 1.0

[vswitch]
# macOS uses plain Ctrl+Left/Right here, but on Linux that is word-wise cursor
# movement in every text field. Alt is added to keep text editing intact; drop
# it if you want the literal macOS chord and never edit text.
binding_left = <ctrl> <alt> KEY_LEFT
binding_right = <ctrl> <alt> KEY_RIGHT
with_win_left = <ctrl> <alt> <shift> KEY_LEFT
with_win_right = <ctrl> <alt> <shift> KEY_RIGHT
duration = 300ms circle

[vswipe]
# Four-finger horizontal swipe between Spaces, tracking the fingers directly.
enable_horizontal = true
enable_vertical = false
fingers = 4
duration = 250ms circle


# --- Look --------------------------------------------------------------------
[blur]
# Kawase is the cheapest of the four methods at a given visual radius, which
# matters because the dock sits over blurred content permanently.
method = kawase
kawase_iterations = 3
kawase_offset = 2.5
saturation = 1.15

[animate]
open_animation = zoom
close_animation = zoom
duration = 250ms circle
startup_duration = 600ms linear

[decoration]
# Traffic lights on the left, in macOS order.
button_order = close minimize maximize
border_size = 0
title_height = 28
font = Inter 11
active_color = 0.86 0.86 0.88 0.96
inactive_color = 0.94 0.94 0.95 0.90

[place]
mode = center


# --- Input -------------------------------------------------------------------
[input]
# Both of these are macOS defaults and neither is the Wayfire default.
natural_scroll = true
tap_to_click = true
touchpad_accel_profile = adaptive
mouse_accel_profile = adaptive


# --- Window management -------------------------------------------------------
[move]
activate = <super> BTN_LEFT

[resize]
activate = <super> BTN_RIGHT

[switcher]
# Cmd-Tab.
next_view = <super> KEY_TAB
prev_view = <super> <shift> KEY_TAB

[wm-actions]
toggle_fullscreen = <super> <ctrl> KEY_F
toggle_always_on_top = <super> <ctrl> KEY_T

[grid]
# macOS has no tiling, but half-screen snapping is too useful to omit.
slot_l = <super> <alt> KEY_LEFT
slot_r = <super> <alt> KEY_RIGHT
slot_c = <super> <alt> KEY_UP


# --- Commands ----------------------------------------------------------------
[command]
# Wayfire logs "The option command/always_binding_X is neither specified nor
# has a default value" for every prefix left out below. It is harmless -- the
# bindings that ARE specified register normally -- and silencing it would mean
# writing four `none` lines per action, which is worse than the noise.
binding_terminal = <super> KEY_ENTER
command_terminal = foot

# Spotlight's chord. wofi stands in until the real launcher exists.
binding_launcher = <super> KEY_SPACE
command_launcher = wofi --show drun

binding_screenshot = <super> <shift> KEY_3
command_screenshot = grim ~/Pictures/screenshot-$(date +%F-%T).png
binding_screenshot_interactive = <super> <shift> KEY_4
command_screenshot_interactive = slurp | grim -g - ~/Pictures/screenshot-$(date +%F-%T).png

repeatable_binding_volume_up = KEY_VOLUMEUP
command_volume_up = wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
repeatable_binding_volume_down = KEY_VOLUMEDOWN
command_volume_down = wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
binding_mute = KEY_MUTE
command_mute = wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle


# --- Session -----------------------------------------------------------------
[autostart]
# We provide our own dock, so wf-shell's panel/dock must stay out of the way.
autostart_wf_shell = false

# Any wallpaper.<ext> is accepted, so a PNG does not have to be renamed. With
# no wallpaper at all, swaybg still runs and paints the desktop grey rather
# than failing on an empty -i.
background = sh -c 'w=$(ls ~/.config/tremista/wallpaper.* 2>/dev/null | head -1); exec swaybg -c 1a1a1a ${w:+-m fill -i "$w"}'
dock = tremista-dock
portal = /usr/libexec/xdg-desktop-portal-wlr

[idle]
screensaver_timeout = 600
dpms_timeout = 900
